# SPDX-License-Identifier: GPL-2.0-only
#
# Nightly refresh of STATUS.md and baseline.txt against rgit main, and of
# the SHA-256 variant (STATUS.sha256.md, baseline.sha256.txt; rgit #643).
# Lead decision (2026-11-12): rgit's CI fails only on regressions; the
# generated status and baseline are refreshed here, as a pull request.
# A manual run from another branch only uploads the results (no PR).
name: refresh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  BRANCH: refresh-status
  TITLE: Refresh STATUS/baseline

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Network fixtures (rgit #87): a missing web server or git daemon is a
      # failure here, not a skip.
      GIT_TEST_HTTPD: "true"
      GIT_TEST_GIT_DAEMON: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Apache for lib-httpd.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apache2
          sudo systemctl stop apache2 || :

      - name: Reference version and cache key
        id: pin
        run: |
          version=$(tr -d ' \n' <REFERENCE_VERSION)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # Same key scheme as rgit's conformance workflow: per version and
          # runner image (ImageOS/ImageVersion are runner env vars).
          echo "cache-key=reference-git-$version-norust-$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"

      - name: Restore reference build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgit-conformance/git-${{ steps.pin.outputs.version }}-norust
          key: ${{ steps.pin.outputs.cache-key }}

      - name: Build reference git (only if this runner image missed the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext libcurl4-openssl-dev libexpat1-dev libpcre2-dev libssl-dev zlib1g-dev
          ./run --build-only

      - name: Check out rgit main
        uses: actions/checkout@v4
        with:
          repository: BaamStudios/rgit
          ref: main
          path: rgit

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgit

      - name: Build rgit
        id: rgit
        run: |
          cargo build --locked --manifest-path rgit/Cargo.toml --bin rgit --bin rgit-test-tool
          echo "commit=$(git -C rgit rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Run the suite (fallback + strict), check, refresh
        id: run
        run: |
          set +e
          ./run --mode both --rgit rgit/target/debug/rgit --check --update-baseline 2>run.log
          rc=$?
          set -e
          cat run.log >&2
          # 0: no regressions, 1: regressions (reported in the PR), else: broken run
          test "$rc" -le 1 || { echo "::error::./run failed with exit code $rc"; exit "$rc"; }
          echo "regressions=$rc" >>"$GITHUB_OUTPUT"
          sed -n '/^## Summary/,/^## Forwarded/p' STATUS.md | sed '$d' | head -c 400000 >>"$GITHUB_STEP_SUMMARY"

      - name: Run the suite with SHA-256 repositories (fallback + strict), check, refresh
        id: run-sha256
        if: always() && steps.run.outcome == 'success'
        run: |
          # The default pass's trash directories are not needed any more.
          rm -rf results/default/*/output
          set +e
          ./run --hash sha256 --mode both --rgit rgit/target/debug/rgit --check --update-baseline 2>run.sha256.log
          rc=$?
          set -e
          cat run.sha256.log >&2
          test "$rc" -le 1 || { echo "::error::./run --hash sha256 failed with exit code $rc"; exit "$rc"; }
          echo "regressions=$rc" >>"$GITHUB_OUTPUT"
          { echo; echo "# SHA-256"; echo
            sed -n '/^## Summary/,/^## Forwarded/p' STATUS.sha256.md | sed '$d' | head -c 400000
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: always() && steps.run.outcome == 'success' && steps.run-sha256.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RGIT_COMMIT: ${{ steps.rgit.outputs.commit }}
        run: |
          files="STATUS.md baseline.txt STATUS.sha256.md baseline.sha256.txt"
          if test -z "$(git status --porcelain -- $files)"
          then
            echo "$files are unchanged"
            exit 0
          fi
          # section VARIANT LOG BASELINE
          section() {
            echo "### $1: regressions against the previous baseline"
            echo
            if grep -q '^REGRESSION:' "$2"
            then
              echo '```'; grep '^REGRESSION:' "$2"; echo '```'
            elif grep -q '^run: no baseline at' "$2"
            then
              echo "No previous baseline: \`$3\` is new."
            else
              echo "None."
            fi
            echo
            echo "### $1: new passes"
            echo
            if grep -q '^new passes' "$2"
            then
              n=$(grep -c '^new passes' "$2")
              echo '```'; grep '^new passes' "$2" | sed 's/ (run --update-baseline)//' | head -n 150; echo '```'
              if test "$n" -gt 150; then echo "… and $((n - 150)) more lines (see $2 in the workflow artifacts)."; fi
            else
              echo "None."
            fi
            echo
            echo "### $3"
            echo
            if git ls-files --error-unmatch "$3" >/dev/null 2>&1
            then
              echo '```diff'; git diff -- "$3" | tail -n +5 | head -n 300; echo '```'
            else
              echo "New file, $(grep -vc '^#' "$3") script entries."
            fi
            echo
          }
          {
            echo "Generated by the nightly \`refresh\` workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            echo "against rgit main BaamStudios/rgit@$RGIT_COMMIT."
            echo
            echo "\`./run [--hash sha256] --mode both --check --update-baseline\`. Merging lowers"
            echo "the baseline for every regression listed below; check them first."
            echo
            section "Default" run.log baseline.txt
            section "SHA-256" run.sha256.log baseline.sha256.txt
          } >pr-body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add $files
          git commit -q -s -m "$TITLE" -m "Generated against rgit main $RGIT_COMMIT."
          git push -f origin "$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if test -n "$pr"
          then
            gh pr edit "$pr" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md
          fi

      - name: Fail on regressions
        if: steps.run.outputs.regressions == '1' || steps.run-sha256.outputs.regressions == '1'
        run: |
          grep -h '^REGRESSION:' run.log run.sha256.log 2>/dev/null | sed 's/^/::error::/'
          exit 1

      - name: Drop the trash directories before the upload
        if: always()
        # Kept trash directories can hold symlink loops (t1006 "loop1",
        # t7001), which make upload-artifact's glob fail with ELOOP.
        run: rm -rf results/*/*/output

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-results
          path: |
            run.log
            run.sha256.log
            STATUS.md
            baseline.txt
            STATUS.sha256.md
            baseline.sha256.txt
            results/**/*.tap
            results/**/*.tsv
            results/**/*.meta
            results/**/*.stderr
          if-no-files-found: warn
