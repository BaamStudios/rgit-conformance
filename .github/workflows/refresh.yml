# SPDX-License-Identifier: GPL-2.0-only
#
# Nightly refresh of STATUS.md and baseline.txt against rgit main.
# Lead decision (2026-11-12): rgit's CI fails only on regressions; the
# generated status and baseline are refreshed here, as a pull request.
name: refresh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  BRANCH: refresh-status
  TITLE: Refresh STATUS/baseline

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reference version and cache key
        id: pin
        run: |
          version=$(tr -d ' \n' <REFERENCE_VERSION)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # Same key scheme as rgit's conformance workflow: per version and
          # runner image (ImageOS/ImageVersion are runner env vars).
          echo "cache-key=reference-git-$version-$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"

      - name: Restore reference build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgit-conformance/git-${{ steps.pin.outputs.version }}
          key: ${{ steps.pin.outputs.cache-key }}

      - name: Build reference git (only if this runner image missed the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext libcurl4-openssl-dev libexpat1-dev libpcre2-dev libssl-dev zlib1g-dev
          ./run --build-only

      - name: Check out rgit main
        uses: actions/checkout@v4
        with:
          repository: BaamStudios/rgit
          ref: main
          path: rgit

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgit

      - name: Build rgit
        id: rgit
        run: |
          cargo build --locked --manifest-path rgit/Cargo.toml --bin rgit
          echo "commit=$(git -C rgit rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Run the suite (fallback + strict), check, refresh
        id: run
        run: |
          set +e
          ./run --mode both --rgit rgit/target/debug/rgit --check --update-baseline 2>run.log
          rc=$?
          set -e
          cat run.log >&2
          # 0: no regressions, 1: regressions (reported in the PR), else: broken run
          test "$rc" -le 1 || { echo "::error::./run failed with exit code $rc"; exit "$rc"; }
          echo "regressions=$rc" >>"$GITHUB_OUTPUT"
          sed -n '/^## Summary/,/^## Forwarded/p' STATUS.md | sed '$d' >>"$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: always() && steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RGIT_COMMIT: ${{ steps.rgit.outputs.commit }}
        run: |
          if git diff --quiet -- STATUS.md baseline.txt
          then
            echo "STATUS.md and baseline.txt are unchanged"
            exit 0
          fi
          {
            echo "Generated by the nightly \`refresh\` workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            echo "against rgit main BaamStudios/rgit@$RGIT_COMMIT."
            echo
            echo "\`./run --mode both --check --update-baseline\`. Merging lowers the baseline"
            echo "for every regression listed below; check them first."
            echo
            echo "### Regressions against the previous baseline"
            echo
            if grep -q '^REGRESSION:' run.log
            then
              echo '```'; grep '^REGRESSION:' run.log; echo '```'
            else
              echo "None."
            fi
            echo
            echo "### New passes"
            echo
            if grep -q '^new passes' run.log
            then
              echo '```'; grep '^new passes' run.log | sed 's/ (run --update-baseline)//'; echo '```'
            else
              echo "None."
            fi
            echo
            echo "### baseline.txt"
            echo
            echo '```diff'; git diff -- baseline.txt | tail -n +5; echo '```'
          } >pr-body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add STATUS.md baseline.txt
          git commit -q -s -m "$TITLE" -m "Generated against rgit main $RGIT_COMMIT."
          git push -f origin "$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if test -n "$pr"
          then
            gh pr edit "$pr" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md
          fi

      - name: Fail on regressions
        if: steps.run.outputs.regressions == '1'
        run: |
          grep '^REGRESSION:' run.log | sed 's/^/::error::/'
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-results
          path: |
            run.log
            results/**/*.tap
            results/**/*.tsv
            results/**/*.meta
            results/**/*.stderr
          if-no-files-found: warn
