#
# Ported C unit tests (unit/, rgit issue #8) against rgit main. Cargo.lock is
# not committed, so every run resolves the current rgit main.
name: unit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
